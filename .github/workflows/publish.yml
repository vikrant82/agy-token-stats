name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # For PyPI trusted publishing (OIDC)
      contents: write  # For creating GitHub Releases

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -t . -v

    - name: Verify tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME}"
        PKG_VERSION="v$(PYTHONPATH=src python -c 'import agy_token_stats; print(agy_token_stats.__version__)')"
        if [ "$TAG" != "$PKG_VERSION" ]; then
          echo "::error::Tag $TAG does not match package version $PKG_VERSION"
          exit 1
        fi

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Uses trusted publishing - configure on PyPI

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: dist/*
